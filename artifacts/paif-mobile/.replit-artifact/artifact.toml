kind = "mobile"
previewPath = "/paif-mobile/"
title = "PAIF.fun Android"
description = "A mobile companion for Solana token research, mobile wallet access, and paper trading."
version = "1.0.0"
id = "artifacts/paif-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/paif-mobile/" ]
localPort = 19425

[services.development]
run = "pnpm --filter @workspace/paif-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/paif-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/paif-mobile", "run", "serve" ]

[services.env]
PORT = "19425"
BASE_PATH = "/paif-mobile/"
